<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f" />
      <stop offset="100%" stop-color="#0e0e13" />
    </linearGradient>

    <!-- Glowing Mint Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82f8c4" />
      <stop offset="50%" stop-color="#62f6b5" />
      <stop offset="100%" stop-color="#37cd8f" />
    </linearGradient>

    <!-- Warm Cream Gradient -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#efebdd" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bgGrad)" stroke="#62f6b5" stroke-opacity="0.28" stroke-width="1.5" />

  <!-- Inner Ambient Aura -->
  <circle cx="32" cy="32" r="22" fill="#62f6b5" fill-opacity="0.08" filter="url(#mintGlow)" />

  <!-- Audio Wave Rings / Sub-10ms Pulse -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#62f6b5" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Lightning / Instant Sub-10ms Bolt Motif -->
  <path d="M35 11 L19 33 L32 33 L29 53 L45 28 L33 28 Z" fill="url(#mintGrad)" filter="url(#mintGlow)" />

  <!-- Subtle Cream Highlight Edge -->
  <path d="M35 11 L29 23 L34 23 L29 33" stroke="url(#creamGrad)" stroke-width="1" fill="none" opacity="0.6" />
</svg>
